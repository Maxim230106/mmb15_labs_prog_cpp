name: release

on:
  push:
    branches: [ lab_02 ]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: lab-02-${{ github.run_number }}

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Release ${{ github.run_number }}" \
              --latest=false
          else
            gh release create "$RELEASE_TAG" \
              --target "${{ github.sha }}" \
              --title "Release ${{ github.run_number }}" \
              --generate-notes
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build-ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Package
        working-directory: build
        run: cpack -C Release

      - name: Find package
        id: package
        shell: bash
        run: |
          package=$(find build -type f -name '*.tar.gz' | head -n 1)

          if [ -z "$package" ]; then
            echo "No .tar.gz package found."
            exit 1
          fi

          echo "path=$package" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
        run: |
          for attempt in 1 2 3; do
            if gh release upload "$RELEASE_TAG" "${{ steps.package.outputs.path }}" --clobber; then
              exit 0
            fi

            echo "Upload attempt $attempt failed, retrying..."
            sleep 5
          done

          echo "Failed to upload Ubuntu package."
          exit 1

  build-windows:
    name: Windows
    runs-on: windows-latest
    needs: create-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Package
        working-directory: build
        run: cpack -C Release

      - name: Find package
        id: package
        shell: powershell
        run: |
          $package = Get-ChildItem -Path build -Filter *.zip -Recurse | Select-Object -First 1

          if (-not $package) {
            Write-Error "No .zip package found."
            exit 1
          }

          "path=$($package.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload release asset
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            gh release upload $env:RELEASE_TAG $env:PACKAGE_PATH --clobber

            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            Write-Host "Upload attempt $attempt failed, retrying..."
            Start-Sleep -Seconds 5
          }

          Write-Error "Failed to upload Windows package."
          exit 1
