name: 'C++ CI'

on:
  push:
    branches: [ lab_01 ]

jobs:
  create_release:
    name: Create Release
    runs-on: windows-latest
    permissions: write-all
    outputs:
      release: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          draft: false
          prerelease: false

  build_ubuntu:
    name: Build for Ubuntu
    runs-on: ubuntu-latest
    permissions: write-all
    needs: create_release
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install libboost-test-dev -y

      - name: Configure (out-of-source)
        run: cmake -S . -B build -DPATCH_VERSION=${{ github.run_number }}

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: cmake --build build --config Release --target test

      - name: Package (CPack)
        run: cmake --build build --config Release --target package

      - name: List build dir (debug)
        run: ls -la build || true

      - name: Find package file
        id: find_pkg
        run: |
          pkg=$(find build -type f -name '*.deb' | head -n 1)
          if [ -z "$pkg" ]; then echo "No .deb found in build/"; ls -la build; exit 1; fi
          echo "asset=$pkg" >> $GITHUB_OUTPUT
          echo "name=$(basename $pkg)" >> $GITHUB_OUTPUT

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.release }}
          asset_path: ${{ steps.find_pkg.outputs.asset }}
          asset_name: ${{ steps.find_pkg.outputs.name }}
          asset_content_type: application/vnd.debian.binary-package

  build_windows:
    name: Build for Windows
    runs-on: windows-latest
    permissions: write-all
    needs: create_release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install vcpkg and dependencies
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg install boost-test

      - name: Configure CMake (out-of-source)
        run: cmake -S . -B build -DPATCH_VERSION=${{ github.run_number }} -DCMAKE_TOOLCHAIN_FILE="vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release

      - name: Package (CPack)
        shell: powershell
        run: |
          pushd build
          cpack -C Release
          popd

      - name: List build dir (debug)
        run: dir build

      - name: Find zip package
        id: find_zip
        shell: powershell
        run: |
          $zip = Get-ChildItem -Path build -Filter *.zip -Recurse | Select-Object -First 1
          if (-not $zip) { Write-Error "No zip found in build/"; exit 1 }
          echo "asset=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          echo "name=$($zip.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.release }}
          asset_path: ${{ steps.find_zip.outputs.asset }}
          asset_name: ${{ steps.find_zip.outputs.name }}
          asset_content_type: application/zip
