name: release

on:
  push:
    branches:
      - lab_04
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: lab-04-${{ github.run_number }}

jobs:
  build-ubuntu:
    name: Build Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Prepare archive
        run: |
          mkdir -p dist
          cp build/lab_04 dist/lab_04
          tar -czf lab_04-ubuntu.tar.gz -C dist lab_04

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab_04-ubuntu
          path: lab_04-ubuntu.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Prepare archive
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\Release\lab_04.exe dist\lab_04.exe
          Compress-Archive -Path dist\lab_04.exe -DestinationPath lab_04-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab_04-windows
          path: lab_04-windows.zip
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - build-ubuntu
      - build-windows

    steps:
      - name: Download Ubuntu artifact
        uses: actions/download-artifact@v4
        with:
          name: lab_04-ubuntu
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: lab_04-windows
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/lab_04-ubuntu.tar.gz artifacts/lab_04-windows.zip --clobber
          else
            gh release create "$RELEASE_TAG" \
              --target "${{ github.sha }}" \
              --title "lab_04 release ${{ github.run_number }}" \
              --generate-notes \
              artifacts/lab_04-ubuntu.tar.gz \
              artifacts/lab_04-windows.zip
          fi
