name: release

on:
  push:
    branches: [ master, lab_02 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
            package_glob: build/**/*.tar.gz
          - name: Windows
            os: windows-latest
            package_glob: build/**/*.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Package
        working-directory: build
        run: cpack -C Release

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ip_filter-${{ runner.os }}
          path: ${{ matrix.package_glob }}
          if-no-files-found: error

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-test-package

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: lab-02-${{ github.run_number }}
        run: |
          mapfile -t files < <(find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \))

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files were found."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
            gh release edit "$RELEASE_TAG" --title "Release ${{ github.run_number }}"
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --target "${{ github.sha }}" \
              --title "Release ${{ github.run_number }}" \
              --generate-notes
          fi
