name: release

on:
  push:
    branches: [ lab_02 ]

jobs:
  build-test-package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
          - name: Windows
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Package
        run: cpack --config build/CPackConfig.cmake

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ip_filter-${{ runner.os }}
          path: |
            build/*.zip
            build/*.tar.gz
